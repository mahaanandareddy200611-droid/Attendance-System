name: Render Staging Read-Only Probe

on:
  push:
    branches:
      - ops/render-staging-probe
    paths:
      - ".github/workflows/render-staging-probe.yml"
      - "backend/scripts/deployment-smoke.js"
      - "backend/package-lock.json"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend smoke dependencies
        working-directory: backend
        run: npm ci
      - name: Diagnose live Render DNS and HTTP response
        shell: bash
        run: |
          set +e
          for host in attendance-backend-staging.onrender.com attendance-lecturer-staging.onrender.com; do
            echo "=== DNS: $host ==="
            getent ahostsv4 "$host" || echo "DNS lookup failed for $host"
          done
          echo "=== Backend liveness ==="
          curl -sS --connect-timeout 8 --max-time 20 -D /tmp/api-headers -o /tmp/api-body -w 'backend_http=%{http_code} remote_ip=%{remote_ip} time=%{time_total}\n' https://attendance-backend-staging.onrender.com/api/v1/livez
          backend_curl=$?
          cat /tmp/api-headers 2>/dev/null
          head -c 1000 /tmp/api-body 2>/dev/null
          echo
          echo "backend_curl_exit=$backend_curl"
          echo "=== Lecturer website ==="
          curl -sS --connect-timeout 8 --max-time 20 -D /tmp/web-headers -o /tmp/web-body -w 'lecturer_http=%{http_code} remote_ip=%{remote_ip} time=%{time_total}\n' https://attendance-lecturer-staging.onrender.com/
          web_curl=$?
          cat /tmp/web-headers 2>/dev/null
          head -c 1000 /tmp/web-body 2>/dev/null
          echo
          echo "lecturer_curl_exit=$web_curl"
          echo "=== Lecturer bundle API origin ==="
          bundle_path="$(grep -oE '/assets/[^"]+\.js' /tmp/web-body 2>/dev/null | head -n 1)"
          if [ -z "$bundle_path" ]; then
            echo "No production JavaScript bundle URL found in lecturer HTML"
            web_bundle_curl=1
          else
            case "$bundle_path" in
              http://*|https://*) bundle_url="$bundle_path" ;;
              /*) bundle_url="https://attendance-lecturer-staging.onrender.com$bundle_path" ;;
              *) bundle_url="https://attendance-lecturer-staging.onrender.com/$bundle_path" ;;
            esac
            echo "Bundle path: $bundle_path"
            curl -sS --connect-timeout 8 --max-time 20 -o /tmp/lecturer-bundle.js -w 'bundle_http=%{http_code} time=%{time_total}\\n' "$bundle_url"
            web_bundle_curl=$?
            if [ "$web_bundle_curl" -eq 0 ] && grep -Fq 'https://attendance-backend-staging.onrender.com/api/v1' /tmp/lecturer-bundle.js; then
              echo "PASS: lecturer bundle contains the configured deployed API base URL"
            else
              echo "FAIL: lecturer bundle is unreachable or does not contain the expected API base URL"
              grep -oE 'https?://[^" ]+/api/v1' /tmp/lecturer-bundle.js 2>/dev/null | sort -u | head -n 10
              web_bundle_curl=1
            fi
          fi
          if [ "$backend_curl" -ne 0 ] || [ "$web_curl" -ne 0 ] || [ "$web_bundle_curl" -ne 0 ]; then exit 1; fi
      - name: Probe live Render backend, lecturer bundle, and CORS
        working-directory: backend
        run: npm run smoke:deployment
        env:
          STAGING_BASE_URL: https://attendance-backend-staging.onrender.com/api/v1
          LECTURER_WEB_BASE_URL: https://attendance-lecturer-staging.onrender.com
          ATTENDANCE_REQUIRE_BIOMETRIC: "true"
