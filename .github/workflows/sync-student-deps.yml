name: Sync Student Expo Dependencies
# One-time lockfile reconciliation workflow reused while hardening a release branch.

on:
  push:
    branches:
      - fix/attendance-frontend-contracts
      - fix/deploy-blockers-evidence-storage
    paths:
      - "student-app/package.json"
      - ".github/workflows/sync-student-deps.yml"

permissions:
  contents: write

concurrency:
  group: student-dependency-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the working branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: student-app/package-lock.json
      - name: Resolve the initial lockfile
        working-directory: student-app
        run: npm install --package-lock-only --ignore-scripts
      - name: Install project dependencies
        working-directory: student-app
        run: npm ci
      - name: Resolve Expo SDK-compatible native modules
        working-directory: student-app
        run: npx expo install expo-camera expo-location expo-secure-store expo-crypto expo-file-system
      - name: Refresh final lockfile
        working-directory: student-app
        run: npm install --package-lock-only --ignore-scripts
      - name: Reinstall exactly from the committed lockfile
        working-directory: student-app
        run: npm ci
      - name: Lint the native student app
        working-directory: student-app
        run: npm run lint
      - name: Export Expo web bundle
        working-directory: student-app
        run: npx expo export --platform web
      - name: Verify and commit the resolved lockfile
        shell: bash
        run: |
          git diff --check
          if ! git diff --quiet -- student-app/package.json student-app/package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add student-app/package.json student-app/package-lock.json
            git commit -m "Resolve Expo SDK-compatible student dependencies [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
