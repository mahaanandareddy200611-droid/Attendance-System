name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - "biometric-provider/**"
      - "biometric-provider/**"
      - ".github/workflows/backend-ci.yml"
      - "render.yaml"
      - "backend/render.yaml"
      - "DEPLOYMENT_READINESS.md"
  pull_request:
    paths:
      - "backend/**"
      - "biometric-provider/**"
      - ".github/workflows/backend-ci.yml"
      - "render.yaml"
      - "backend/render.yaml"
      - "DEPLOYMENT_READINESS.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Start MongoDB replica set
        uses: supercharge/mongodb-github-action@1.12.1
        with:
          mongodb-version: "7.0"
          mongodb-replica-set: rs0
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Run unit and database/Redis integration tests
        working-directory: backend
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: attendance-ci-jwt-secret-not-for-production-32-bytes
          JWT_EXPIRES_IN: 1h
          ATTENDANCE_TOKEN_SECRET: attendance-ci-token-secret-not-for-production-32-bytes
          MONGO_URL: mongodb://127.0.0.1:27017/attendance_system?replicaSet=rs0
          TEST_MONGO_URL: mongodb://127.0.0.1:27017/attendance_test?replicaSet=rs0
          REDIS_URL: redis://127.0.0.1:6379/15
          TEST_REDIS_URL: redis://127.0.0.1:6379/15
          CORS_ORIGINS: http://localhost:5173

      - name: Validate biometric provider entrypoint
        run: sh -n biometric-provider/entrypoint.sh

      - name: Build the liveness-capable biometric provider image
        run: docker build --pull --tag attendance-biometric-provider:ci --file biometric-provider/Dockerfile biometric-provider

      - name: Build the production Docker image used by Render
        run: docker build --pull --tag attendance-backend:ci --file backend/Dockerfile backend

      - name: Validate biometric provider startup shell
        run: sh -n biometric-provider/entrypoint.sh

      - name: Verify biometric startup refuses missing licence acceptance
        shell: bash
        run: |
          set +e
          output="$(BIOMETRIC_MODEL_LICENSE_ACCEPTED=false INSIGHTFACE_API_KEY=ci-not-a-real-key sh biometric-provider/entrypoint.sh 2>&1)"
          status=$?
          set -e
          if [ "$status" -ne 78 ]; then
            printf '%s\n' "$output"
            echo "Startup must refuse an unaccepted model licence." >&2
            exit 1
          fi
          printf '%s\n' "$output" | grep -F "Refusing to install face models"
          set +e
          output="$(BIOMETRIC_MODEL_LICENSE_ACCEPTED=true INSIGHTFACE_API_KEY= sh biometric-provider/entrypoint.sh 2>&1)"
          status=$?
          set -e
          if [ "$status" -ne 78 ]; then
            printf '%s\n' "$output"
            echo "Startup must refuse a missing API key." >&2
            exit 1
          fi
          printf '%s\n' "$output" | grep -F "INSIGHTFACE_API_KEY must be configured"

      - name: Build the licensed-gated biometric provider image
        run: docker build --pull --tag attendance-biometric:ci --file biometric-provider/Dockerfile biometric-provider
