services:
  - type: web
    name: attendance-backend-staging
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/v1/livez
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: ATTENDANCE_RELEASE_CHANNEL
        value: staging
      - key: ATTENDANCE_REQUIRE_BIOMETRIC
        value: "true"
      - key: ATTENDANCE_REQUIRE_PRIVATE_STORAGE
        value: "true"
      - key: ATTENDANCE_REQUIRE_EMAIL
        value: "true"
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: PORT
        value: "10000"
      - key: JWT_SECRET
        generateValue: true
      - key: ATTENDANCE_TOKEN_SECRET
        generateValue: true
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: attendance-redis-staging
          property: connectionString

      - key: MONGO_URL
        sync: false
      - key: JWT_EXPIRES_IN
        sync: false
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_USER
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_SECURE
        value: ""
      - key: QR_REFRESH_MS
        value: "1500"
      - key: QR_ALLOWED_SKEW_SLOTS
        value: "1"
      - key: QR_CHALLENGE_TTL_MS
        value: "5000"
      - key: ATTENDANCE_SESSION_MINUTES
        value: "60"
      - key: CORS_ORIGINS
        value: https://attendance-lecturer-staging.onrender.com
      - key: ATTENDANCE_STUDENT_RATE_CAPACITY
        sync: false
      - key: ATTENDANCE_STUDENT_RATE_REFILL
        sync: false
      - key: ATTENDANCE_IP_RATE_CAPACITY
        sync: false
      - key: ATTENDANCE_IP_RATE_REFILL
        sync: false

      - key: BIOMETRIC_CHALLENGE_TTL_MS
        value: "30000"
      - key: BIOMETRIC_PRODUCTION_APPROVED
        value: "false"
      - key: BIOMETRIC_BASE_URL
        sync: false
      - key: BIOMETRIC_API_KEY
        sync: false
      - key: BIOMETRIC_COLLECTION_ID
        value: students
      - key: BIOMETRIC_MODEL_VERSION
        sync: false
      - key: BIOMETRIC_TIMEOUT_MS
        value: "5000"
      - key: BIOMETRIC_MATCH_THRESHOLD
        value: "0.40"
      - key: BIOMETRIC_LIVENESS_THRESHOLD
        sync: false
      - key: BIOMETRIC_ASSERTION_TTL_MS
        value: "30000"
      - key: OBJECT_STORAGE_ENDPOINT
        sync: false
      - key: OBJECT_STORAGE_BUCKET
        sync: false
      - key: OBJECT_STORAGE_REGION
        value: us-east-005
      - key: OBJECT_STORAGE_ACCESS_KEY_ID
        sync: false
      - key: OBJECT_STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: OBJECT_STORAGE_TIMEOUT_MS
        value: "10000"
      - key: OBJECT_STORAGE_PURGE_VERSIONS
        value: "true"
      - key: MEDIA_RETENTION_DAYS
        value: "30"
      - key: MEDIA_URL_TTL_SECONDS
        value: "60"
      - key: ATTENDANCE_EVIDENCE_RETENTION_DAYS
        value: "7"

      - key: ATTENDANCE_MAX_GPS_ACCURACY_METERS
        value: "150"
      - key: ATTENDANCE_MAX_GPS_AGE_MS
        value: "120000"

  - type: web
    name: attendance-lecturer-staging
    runtime: static
    branch: main
    buildCommand: cd lecturer-web && npm ci && npm run build
    staticPublishPath: ./lecturer-web/dist
    autoDeployTrigger: off
    envVars:
      - key: VITE_API_BASE_URL
        value: https://attendance-backend-staging-n04q.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY

  - type: keyvalue
    name: attendance-redis-staging
    plan: free
    region: singapore
    maxmemoryPolicy: noeviction
    ipAllowList: []