services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: attendance-backend

    env_file:
      - .env.docker

    ports:
      - "3000:3000"

    depends_on:
      redis:
        condition: service_healthy

    restart: unless-stopped


  redis:
    image: redis:7-alpine

    container_name: attendance-redis

    restart: unless-stopped

    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]

      interval: 5s
      timeout: 3s
      retries: 10